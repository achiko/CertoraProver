[package]
name = "soroban-multi-assert"
version = "0.0.0"
edition = "2021"
publish = false


[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "22.0.11" }
cvlr = "0.5.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[features]
certora = []
