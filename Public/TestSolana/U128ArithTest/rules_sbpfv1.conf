{
    "build_script": "./certora_build_sbpfv1.sh",
    "java_args": ["-Dlevel.sbf=info"],
    "rule": [
       "rule_shift_left",
       "rule_shift_right",
       "check_u128_wrapping_sub",
       "check_u128_wrapping_sub_fail",
       "check_u128_saturating_and_wrapping_sub_equiv",
       "check_u128_saturating_and_wrapping_sub_equiv_fail",
       "check_u128_checked_and_wrapping_sub_equiv"
    ],
    "prover_args": [
	"-solanaSkipCallRegInst true",
        "-solanaPrintDevMsg true",
        "-solanaPrintAnalyzedToDot",
	"-solanaPromoteMathIntrinsics true"
    ],
    "rule_sanity": "basic"
}
