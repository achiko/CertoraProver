{
    "build_script": "./certora_build.sh",
    "java_args": ["-Dlevel.sbf=info"],
    "rule": [
        "rent_minimum_balance_nonzero",
        "rent_minimum_balance_nonzero_fail"
    ],
    "prover_args": [
	"-solanaSkipCallRegInst true",
	"-solanaTACOptimize 2",
        "-solanaPrintDevMsg true",
        "-solanaPrintAnalyzedToDot"
    ],
    "rule_sanity": "basic"
}
